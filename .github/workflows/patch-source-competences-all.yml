name: Padronizar competências nas fontes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-source-competences-all.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Aplicar padronização
        run: |
          node scripts/patch-source-competences-runtime.js
          node --check onepage-ajustes.js

      - name: Remover patch temporário
        run: |
          rm -f .github/workflows/patch-source-competences-all.yml
          rm -f scripts/patch-source-competences-runtime.js

      - name: Commitar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add onepage-ajustes.js .github/workflows/patch-source-competences-all.yml scripts/patch-source-competences-runtime.js
          git commit -m "feat: padroniza competências nas fontes do One Page"
          git push origin main
