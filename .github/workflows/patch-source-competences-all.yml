name: Padronizar competências nas fontes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-source-competences-all.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Aplicar padronização
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('onepage-ajustes.js')
          text = path.read_text(encoding='utf-8')
          marker = '/* ===== Padronização global de competências das fontes · v2 ===== */'

          block = r'''

/* ===== Padronização global de competências das fontes · v2 ===== */
(() => {
  "use strict";

  const MONTHS_PT = [
    "jan", "fev", "mar", "abr", "mai", "jun",
    "jul", "ago", "set", "out", "nov", "dez"
  ];

  let timer = null;
  let lastCityKey = "";
  let cachedLeitosComp = null;

  function formatCompetence(value) {
    const raw = String(value || "").trim();
    if (!raw || raw === "—") return null;

    const digits = raw.replace(/\D/g, "");
    let year = null;
    let month = null;

    if (digits.length >= 6 && /^20\d{4}/.test(digits.slice(0, 6))) {
      year = Number(digits.slice(0, 4));
      month = Number(digits.slice(4, 6));
    } else if (digits.length >= 6) {
      month = Number(digits.slice(0, 2));
      year = Number(digits.slice(2, 6));
    }

    if (year && month >= 1 && month <= 12) {
      return `${MONTHS_PT[month - 1]}/${year}`;
    }

    return raw;
  }

  function cityId() {
    try {
      return typeof state !== "undefined" ? String(state?.city?.id || "") : "";
    } catch {
      return "";
    }
  }

  function ansCompetence(scope) {
    return formatCompetence(
      document.getElementById(`${scope}-ans-month`)?.textContent
    );
  }

  async function leitosCompetence() {
    const id = cityId();
    const cod6 = id.slice(0, 6);
    if (!cod6) return null;

    if (lastCityKey === cod6 && cachedLeitosComp) return cachedLeitosComp;

    try {
      const response = await fetch(`/proxy/elastic/leitos?cod=${encodeURIComponent(cod6)}`);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();
      const comp = formatCompetence(data?.comp);
      lastCityKey = cod6;
      cachedLeitosComp = comp;
      return comp;
    } catch (error) {
      console.warn("Falha ao consultar competência ElastiCNES:", error);
      return null;
    }
  }

  function setText(node, value) {
    if (node && value && node.textContent !== value) node.textContent = value;
  }

  function cardSource(id) {
    return document.getElementById(id)
      ?.closest(".card")
      ?.querySelector("p.muted");
  }

  function updateElastiSources(comp) {
    if (!comp) return;

    setText(
      cardSource("micro-leitos-priv-evol"),
      `Fonte: CNES · ElastiCNES · snapshots anuais; última competência: ${comp}.`
    );

    setText(
      cardSource("city-leitos-priv-evol"),
      `Fonte: CNES · ElastiCNES · snapshots anuais; última competência: ${comp}.`
    );

    setText(
      cardSource("micro-leitos-table"),
      `Fonte: CNES · ElastiCNES · competência ${comp}. Comparativo: microrregião de Porto Alegre.`
    );

    setText(
      cardSource("city-leitos-table"),
      `Fonte: CNES · ElastiCNES · competência ${comp}.`
    );

    const top3 = document.getElementById("top3-hospitals")?.closest(".card");
    if (top3) {
      const source = [...top3.querySelectorAll("p.muted")][0];
      setText(
        source,
        `Ranking por número total de leitos. Fonte: CNES · ElastiCNES · competência ${comp}.`
      );
    }

    // Fallback global para qualquer texto antigo ainda visível no One Page.
    document.querySelectorAll("p.muted").forEach(node => {
      const text = String(node.textContent || "");

      if (/CNES\s*·?\s*ElastiCNES/i.test(text) && /snapshot anual|snapshots anuais|última competência disponível/i.test(text)) {
        setText(
          node,
          `Fonte: CNES · ElastiCNES · snapshots anuais; última competência: ${comp}.`
        );
      }
    });
  }

  function updateAnsSources() {
    const city = ansCompetence("city");
    const micro = ansCompetence("micro") || city;

    if (micro) {
      setText(
        cardSource("micro-ans-evol"),
        `Fonte: ANS · PDA 024 · competência publicada: ${micro}.`
      );
    }

    if (city) {
      const card = document.getElementById("city-ans-evol")?.closest(".card");
      if (card) {
        let source = card.querySelector("p.muted[data-source-competence='ans-global']");
        if (!source) {
          source = document.createElement("p");
          source.className = "muted";
          source.dataset.sourceCompetence = "ans-global";
          card.appendChild(source);
        }
        setText(source, `Fonte: ANS · PDA 024 · competência publicada: ${city}.`);
      }
    }
  }

  function normalizeEmbeddedCompetences() {
    [
      "city-med-density-comp",
      "city-ans-month",
      "micro-ans-month"
    ].forEach(id => {
      const node = document.getElementById(id);
      if (!node) return;
      const formatted = formatCompetence(node.textContent);
      if (formatted && node.textContent !== formatted) node.textContent = formatted;
    });
  }

  async function refresh() {
    normalizeEmbeddedCompetences();
    updateAnsSources();
    const comp = await leitosCompetence();
    updateElastiSources(comp);
  }

  function schedule() {
    window.clearTimeout(timer);
    timer = window.setTimeout(refresh, 350);
  }

  function init() {
    schedule();

    const dashboard = document.getElementById("dashboard") || document.body;
    const observer = new MutationObserver(schedule);
    observer.observe(dashboard, {
      subtree: true,
      childList: true,
      characterData: true
    });

    window.addEventListener("beforeprint", schedule);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init, { once: true });
  } else {
    init();
  }
})();
'''

          if marker not in text:
              path.write_text(text.rstrip() + block + '\n', encoding='utf-8')
          PY

          node --check onepage-ajustes.js
          rm -f .github/workflows/patch-source-competences-all.yml

      - name: Commitar alteração
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add onepage-ajustes.js .github/workflows/patch-source-competences-all.yml
          git commit -m "feat: padroniza competências nas fontes do One Page"
          git push origin main
