name: Atualizar CNES médicos

on:
  push:
    branches:
      - fix/medical-density-profile
    paths:
      - "scripts/gerar_cnes_medicos.R"
      - ".github/workflows/test-cnes-medicos.yml"
  schedule:
    - cron: "20 8 20 * *"
  workflow_dispatch:
    inputs:
      competencia:
        description: "Competência AAAAMM, vazio = descobrir automaticamente"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Instalar dependências
        shell: Rscript {0}
        run: |
          install.packages(c("jsonlite", "curl"))
          install.packages("https://github.com/danicat/read.dbc/archive/refs/heads/master.tar.gz", repos = NULL, type = "source")

      - name: Gerar bases de médicos
        env:
          COMP_INPUT: ${{ github.event.inputs.competencia || '' }}
        run: |
          Rscript scripts/gerar_cnes_medicos.R "RS" "$COMP_INPUT"
          Rscript scripts/gerar_cnes_medicos.R "SC" "$COMP_INPUT"

      - name: Validar JSON
        run: |
          test -s "data/cnes_medicos_RS.json"
          test -s "data/cnes_medicos_SC.json"
          python - <<'PY'
          import json
          for uf in ("RS", "SC"):
              p = f"data/cnes_medicos_{uf}.json"
              d = json.load(open(p, encoding="utf-8"))
              assert d["cities"], f"{uf}: cities vazio"
              print(uf, "competencia", d["comp"], "municipios", len(d["cities"]))
          rs = json.load(open("data/cnes_medicos_RS.json", encoding="utf-8"))
          for cod in ("431680", "430510", "431490"):
              print(cod, rs["cities"][cod]["total"])
          PY

      - name: Commit do JSON de teste
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cnes_medicos_*.json
          if git diff --cached --quiet; then
            echo "Sem alterações."
          else
            git commit -m "data: atualizar médicos CNES [skip cnes]"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
