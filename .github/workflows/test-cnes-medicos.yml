name: Atualizar CNES médicos

on:
  push:
    branches:
      - fix/medical-density-profile
      - main
    paths:
      - "scripts/gerar_cnes_medicos.R"
      - ".github/workflows/test-cnes-medicos.yml"
      - "scripts/validar_cnes_medicos.py"
      - "scripts/publicar_cnes_medicos.py"
  schedule:
    - cron: "20 8 20 * *"
  workflow_dispatch:
    inputs:
      competencia:
        description: "Competência AAAAMM, vazio = descobrir automaticamente"
        required: false
        default: ""

concurrency:
  group: cnes-medicos-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Instalar dependências
        shell: Rscript {0}
        run: |
          install.packages(c("jsonlite", "curl"))
          install.packages("https://github.com/danicat/read.dbc/archive/refs/heads/master.tar.gz", repos = NULL, type = "source")

      - name: Gerar bases de médicos
        env:
          COMP_INPUT: ${{ github.event.inputs.competencia || '' }}
        run: |
          Rscript scripts/gerar_cnes_medicos.R "RS" "$COMP_INPUT"
          Rscript scripts/gerar_cnes_medicos.R "SC" "$COMP_INPUT"

      - name: Validar JSON
        run: python scripts/validar_cnes_medicos.py

      - name: Publicar snapshots sem sobrescrever mudanças simultâneas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/publicar_cnes_medicos.py
