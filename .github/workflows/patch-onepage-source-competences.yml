name: Aplicar competências nas referências

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-onepage-source-competences.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Aplicar ajuste
        shell: bash
        env:
          SOURCE_BLOCK_B64: ""
        run: |
          if ! grep -Fq "Competências nas referências · v1" onepage-ajustes.js; then
            printf '\n' >> onepage-ajustes.js
            echo "$SOURCE_BLOCK_B64" | base64 -d >> onepage-ajustes.js
          fi
          node --check onepage-ajustes.js
          rm -f .github/workflows/patch-onepage-source-competences.yml

      - name: Commitar alteração
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add onepage-ajustes.js .github/workflows/patch-onepage-source-competences.yml
          git commit -m "feat: exibe competências nas referências do One Page"
          git push origin main
